
services:
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - VOSK_MODEL_PATH=/app/models/vosk-model-pt
      - SECRET_KEY=${SECRET_KEY}  # REQUIRED: no default, must be set
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}  # REQUIRED: comma-separated, no default
    volumes:
      - ./backend/models:/app/models:ro
      - ./backend/roteiros:/app/backend/roteiros:ro
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: unless-stopped

networks:
  default:
    name: teleprompter-network
