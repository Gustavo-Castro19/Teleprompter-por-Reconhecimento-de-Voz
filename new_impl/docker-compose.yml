
services:
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - VOSK_MODEL_PATH=/app/models/vosk-model-pt
      - SECRET_KEY=${SECRET_KEY}  # REQUIRED: no default, must be set
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}  # REQUIRED: comma-separated, no default
    volumes:
      - ./models:/app/models:ro
      - ./backend/roteiros:/app/backend/roteiros:ro
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: teleprompter-network
